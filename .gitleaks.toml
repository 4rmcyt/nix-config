title = "gitleaks config"

[extend]
useDefault = true


# sops-encrypted values — ENC[AES256_GCM,...] pattern
[[allowlists]]
description = "SOPS-encrypted values"
regexTarget = "line"
regexes = ['''ENC\[AES256_GCM''']

# Age public keys are not secrets
[[allowlists]]
description = "Age public keys"
regexTarget = "line"
regexes = ['''age1[a-z0-9]{58}''']

# Age encrypted file blocks inside sops yaml
[[allowlists]]
description = "Age encrypted file blocks"
regexTarget = "line"
regexes = [
  '''-----BEGIN AGE ENCRYPTED FILE-----''',
  '''-----END AGE ENCRYPTED FILE-----''',
]

# secrets/ directory — all files are sops-encrypted
[[allowlists]]
description = "secrets/ directory is fully sops-encrypted"
paths = [
  '''secrets/.*''',
  '''secrets\.yaml''',
]

# False positives — config values that match secret patterns
[[allowlists]]
description = "False positives in config files"
regexTarget = "line"
regexes = [
  # curl --user=admin template in monitoring
  '''--user=admin''',
  # NextDNS template ID in chromium policy
  '''dns\.nextdns\.io''',
]

# keycloak SECRETS-TEMPLATE.md — placeholder examples
[[allowlists]]
description = "Keycloak secrets template placeholders"
paths = ['''modules/security/keycloak/SECRETS-TEMPLATE\.md''']

# ripsecrets own config
[[allowlists]]
description = "ripsecrets config file"
paths = ['''\.ripsecrets\.toml''']

# sops secret references in nix code are not leaked secrets
[[allowlists]]
description = "sops secret path references in nix"
regexTarget = "line"
regexes = ['''config\.sops\.secrets\.[^.]+\.path''']

