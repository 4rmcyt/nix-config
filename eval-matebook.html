<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nix Eval — matebook</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #1a1a2e; color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 24px; }
      h1 { font-size: 1.2rem; color: #4ecca3; margin-bottom: 16px; font-family: monospace; }
      .grid { display: grid; gap: 20px; }
      .top-stats { grid-template-columns: repeat(4, 1fr); }
      .main-grid { grid-template-columns: repeat(3, 1fr); margin-top: 20px; }
      .card { background: #16213e; border-radius: 12px; padding: 24px; border: 1px solid #1a1a4e; }
      .stat-card .value { font-size: 2rem; font-weight: 700; font-family: "JetBrains Mono", "Fira Code", monospace; color: #fff; }
      .stat-card .label { font-size: 0.75rem; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }
      .card h3 { font-size: 0.85rem; color: #aaa; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
      .bar-row { display: flex; align-items: center; margin-bottom: 12px; }
      .bar-label { width: 130px; font-size: 0.8rem; color: #aaa; flex-shrink: 0; }
      .bar-track { flex: 1; height: 24px; background: #0f3460; border-radius: 6px; overflow: hidden; margin: 0 12px; }
      .bar-fill { height: 100%; border-radius: 6px; transition: width 0.6s ease; }
      .bar-value { font-size: 0.8rem; color: #ccc; width: 70px; text-align: right; font-family: monospace; flex-shrink: 0; }
      .donut-container { display: flex; align-items: center; gap: 24px; }
      .donut-legend { display: flex; flex-direction: column; gap: 10px; }
      .legend-item { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; }
      .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
      .legend-bytes { color: #ccc; font-family: monospace; margin-left: auto; min-width: 80px; text-align: right; }
      .legend-pct { color: #888; font-size: 0.75rem; min-width: 40px; text-align: right; }
      .gc-stats { margin-top: 16px; padding-top: 12px; border-top: 1px solid #1a1a4e; font-size: 0.75rem; color: #888; }
      .gc-stats span { margin-right: 16px; } .gc-stats b { color: #ccc; }
      .metric-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
      .metric-box { background: #0f3460; border-radius: 8px; padding: 16px; }
      .metric-box .val { font-size: 1.5rem; font-weight: 700; font-family: monospace; color: #fff; }
      .metric-box .lbl { font-size: 0.7rem; color: #888; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px; }
      .avoidance { margin-top: 16px; } .avoidance-bar { height: 8px; background: #0f3460; border-radius: 4px; overflow: hidden; margin-top: 8px; }
      .avoidance-fill { height: 100%; border-radius: 4px; background: linear-gradient(90deg, #4ecca3, #48b1e0); }
      .avoidance-label { font-size: 0.8rem; color: #aaa; }
      .nav { margin-bottom: 16px; display: flex; gap: 12px; }
      .nav a { color: #48b1e0; text-decoration: none; font-family: monospace; font-size: 0.85rem; padding: 4px 12px; border: 1px solid #1a1a4e; border-radius: 6px; }
      .nav a.active { background: #16213e; color: #4ecca3; border-color: #4ecca3; }
    </style>
  </head>
  <body>
    <div class="nav">
      <a href="eval-desktop.html">desktop</a>
      <a href="eval-homeserver.html">homeserver</a>
      <a class="active" href="eval-matebook.html">matebook</a>
      <a href="eval-wsl.html">wsl</a>
    </div>
    <h1>matebook</h1>
    <div class="grid top-stats" id="topStats"></div>
    <div class="grid main-grid" id="mainGrid"></div>
    <script>
      const raw = `{
  "cpuTime": 13.6875,
  "envs": {
    "bytes": 305063992,
    "elements": 22612147,
    "number": 15520852
  },
  "gc": {
    "heapSize": 1476657152,
    "totalBytes": 2268494512
  },
  "list": {
    "bytes": 40342672,
    "concats": 710755,
    "elements": 5042834
  },
  "nrAvoided": 17368369,
  "nrFunctionCalls": 13635851,
  "nrLookups": 8228278,
  "nrOpUpdateValuesCopied": 47413318,
  "nrOpUpdates": 1294043,
  "nrPrimOpCalls": 6706930,
  "nrThunks": 20460075,
  "sets": {
    "bytes": 1074270296,
    "elements": 65075961,
    "number": 4131865
  },
  "sizes": {
    "Attr": 16,
    "Bindings": 8,
    "Env": 8,
    "Value": 8
  },
  "symbols": {
    "bytes": 1673597,
    "number": 126288
  },
  "values": {
    "bytes": 0,
    "number": 0
  }
}`;
      const d = JSON.parse(raw);
      function fmt(n) { if (n >= 1e9) return (n / 1e9).toFixed(2) + " GB"; if (n >= 1e6) return (n / 1e6).toFixed(2) + " MB"; if (n >= 1e3) return (n / 1e3).toFixed(2) + " KB"; return n + " B"; }
      function fmtN(n) { if (n >= 1e6) return (n / 1e6).toFixed(2) + "M"; if (n >= 1e3) return (n / 1e3).toFixed(2) + "K"; return n.toString(); }
      const totalMem = d.sets.bytes + d.envs.bytes + d.list.bytes + d.symbols.bytes + (d.values.bytes || 0);
      const totalThunks = d.nrThunks + d.nrAvoided;
      const gcCycles = Math.round(d.gc.totalBytes / d.gc.heapSize);
      const gcFraction = ((d.gc.heapSize / d.gc.totalBytes) * 100).toFixed(2);
      document.getElementById("topStats").innerHTML = [
        { v: d.cpuTime.toFixed(3) + "s", l: "CPU Time" }, { v: fmt(totalMem), l: "Memory" },
        { v: fmtN(d.nrThunks + d.nrAvoided + d.nrFunctionCalls), l: "Expressions" },
        { v: fmtN(d.nrAvoided) + " / " + fmtN(totalThunks), l: "Thunks (avoided / total)" },
      ].map((s) => `<div class="card stat-card"><div class="value">${s.v}</div><div class="label">${s.l}</div></div>`).join("");
      const memSlices = [
        { label: "Sets", bytes: d.sets.bytes, color: "#4ecca3" }, { label: "Values", bytes: d.values.bytes || 1, color: "#f9a825" },
        { label: "Envs", bytes: d.envs.bytes, color: "#48b1e0" }, { label: "Lists", bytes: d.list.bytes, color: "#7c4dff" },
        { label: "Symbols", bytes: d.symbols.bytes, color: "#e91e63" },
      ].filter((s) => s.bytes > 0);
      function donutSVG(slices, total, size = 160) {
        const cx = size / 2, cy = size / 2, r = size / 2 - 10, ri = r * 0.6; let angle = -90, paths = "";
        slices.forEach((s) => { const pct = s.bytes / total; const a1 = (angle * Math.PI) / 180; const a2 = ((angle + pct * 360) * Math.PI) / 180;
          const large = pct > 0.5 ? 1 : 0; const x1o = cx + r * Math.cos(a1), y1o = cy + r * Math.sin(a1);
          const x2o = cx + r * Math.cos(a2), y2o = cy + r * Math.sin(a2); const x1i = cx + ri * Math.cos(a2), y1i = cy + ri * Math.sin(a2);
          const x2i = cx + ri * Math.cos(a1), y2i = cy + ri * Math.sin(a1);
          paths += `<path d="M${x1o},${y1o} A${r},${r} 0 ${large} 1 ${x2o},${y2o} L${x1i},${y1i} A${ri},${ri} 0 ${large} 0 ${x2i},${y2i} Z" fill="${s.color}"/>`; angle += pct * 360; });
        return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${paths}<text x="${cx}" y="${cy - 6}" text-anchor="middle" fill="#fff" font-size="16" font-weight="700" font-family="monospace">${fmt(total)}</text><text x="${cx}" y="${cy + 12}" text-anchor="middle" fill="#888" font-size="9" text-transform="uppercase">TOTAL</text></svg>`;
      }
      const memCard = `<div class="card"><h3>Memory Distribution</h3><div class="donut-container">${donutSVG(memSlices, totalMem)}<div class="donut-legend">${memSlices.map((s) => { const pct = ((s.bytes / totalMem) * 100).toFixed(1); return `<div class="legend-item"><span class="legend-dot" style="background:${s.color}"></span><span>${s.label}</span><span class="legend-bytes">${fmt(s.bytes)}</span><span class="legend-pct">${pct}%</span></div>`; }).join("")}</div></div><div class="gc-stats"><span>GC STATISTICS:</span><span>HEAP: <b>${fmt(d.gc.heapSize)}</b></span><span>ALLOCATED: <b>${fmt(d.gc.totalBytes)}</b></span><span>CYCLES: <b>~${gcCycles}</b></span></div></div>`;
      const avoidRate = ((d.nrAvoided / totalThunks) * 100).toFixed(1);
      const thunksCard = `<div class="card"><h3>Time & Thunks</h3><div class="bar-row"><span class="bar-label">Evaluation</span><div class="bar-track"><div class="bar-fill" style="width:100%;background:#48b1e0"></div></div><span class="bar-value">${d.cpuTime.toFixed(3)}s</span></div><div style="margin:8px 0; font-size:0.75rem; color:#666;">GC CYCLES: <b style="color:#ccc">${gcCycles}</b> &nbsp; HEAP SIZE: <b style="color:#ccc">${fmt(d.gc.heapSize)}</b> &nbsp; GC FRACTION: <b style="color:#ccc">${gcFraction}%</b></div><div class="bar-row"><span class="bar-label">Created</span><div class="bar-track"><div class="bar-fill" style="width:${(d.nrThunks / totalThunks) * 100}%;background:#4ecca3"></div></div><span class="bar-value">${fmtN(d.nrThunks)}</span></div><div class="bar-row"><span class="bar-label">Avoided</span><div class="bar-track"><div class="bar-fill" style="width:${(d.nrAvoided / totalThunks) * 100}%;background:#f9a825"></div></div><span class="bar-value">${fmtN(d.nrAvoided)}</span></div><div class="avoidance"><span class="avoidance-label">Avoidance rate: ${avoidRate}%</span><div class="avoidance-bar"><div class="avoidance-fill" style="width:${avoidRate}%"></div></div></div></div>`;
      const ops = [{ label: "Values Copied", val: d.nrOpUpdateValuesCopied, color: "#4ecca3" }, { label: "Function Calls", val: d.nrFunctionCalls, color: "#48b1e0" }, { label: "Lookups", val: d.nrLookups, color: "#7c4dff" }, { label: "PrimOp Calls", val: d.nrPrimOpCalls, color: "#f9a825" }, { label: "Op Updates", val: d.nrOpUpdates, color: "#e91e63" }];
      const maxOp = Math.max(...ops.map((o) => o.val));
      const opsCard = `<div class="card"><h3>Operations</h3>${ops.map((o) => `<div class="bar-row"><span class="bar-label">${o.label}</span><div class="bar-track"><div class="bar-fill" style="width:${(o.val / maxOp) * 100}%;background:${o.color}"></div></div><span class="bar-value">${fmtN(o.val)}</span></div>`).join("")}</div>`;
      const envsCard = `<div class="card"><h3>Environments</h3><div class="metric-grid"><div class="metric-box"><div class="val">${fmtN(d.envs.number)}</div><div class="lbl">Count</div></div><div class="metric-box"><div class="val">${fmtN(d.envs.elements)}</div><div class="lbl">Elements</div></div><div class="metric-box"><div class="val">${fmt(d.envs.bytes)}</div><div class="lbl">Memory</div></div></div></div>`;
      const vsCard = `<div class="card"><h3>Values & Symbols</h3><div class="metric-grid"><div class="metric-box"><div class="val">${fmtN(d.symbols.number)}</div><div class="lbl">Symbols</div></div><div class="metric-box"><div class="val">${fmt(d.symbols.bytes)}</div><div class="lbl">Symbol Bytes</div></div><div class="metric-box"><div class="val">${d.sizes.Value}B</div><div class="lbl">Value Size</div></div></div></div>`;
      const lsCard = `<div class="card"><h3>Lists & Sets</h3><div class="metric-grid"><div class="metric-box"><div class="val">${fmtN(d.list.elements)}</div><div class="lbl">List Elements</div></div><div class="metric-box"><div class="val">${fmtN(d.list.concats)}</div><div class="lbl">Concat Ops</div></div><div class="metric-box"><div class="val">${fmtN(d.sets.number)}</div><div class="lbl">Set Count</div></div><div class="metric-box"><div class="val">${fmtN(d.sets.elements)}</div><div class="lbl">Set Elements</div></div><div class="metric-box"><div class="val">${fmt(d.sets.bytes)}</div><div class="lbl">Set Memory</div></div><div class="metric-box"><div class="val">${d.sizes.Attr}B</div><div class="lbl">Attr Size</div></div></div></div>`;
      document.getElementById("mainGrid").innerHTML = memCard + thunksCard + opsCard + envsCard + vsCard + lsCard;
    </script>
  </body>
</html>
