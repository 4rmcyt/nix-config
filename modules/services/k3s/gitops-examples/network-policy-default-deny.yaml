# Default deny all traffic NetworkPolicy
# Add this to your gitops repo at: k3s/network-policies/default-deny.yaml
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: default
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
# Allow Keycloak to access PostgreSQL
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak-allow-egress
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: keycloak
  policyTypes:
  - Egress
  egress:
  # Allow DNS
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
  # Allow PostgreSQL (external - not a pod, use ipBlock)
  - to:
    - ipBlock:
        cidr: 192.168.1.0/24
    ports:
    - protocol: TCP
      port: 5432
  # Allow HTTPS to internet (for downloading themes, etc)
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
        except:
        - 169.254.0.0/16  # Exclude link-local
        - 127.0.0.0/8     # Exclude localhost
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80
---
# Allow ingress to Keycloak from LoadBalancer
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak-allow-ingress
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: keycloak
  policyTypes:
  - Ingress
  ingress:
  # Allow from anywhere on port 8080 (LoadBalancer will handle external access)
  - from:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 8080
