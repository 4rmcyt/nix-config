# Minimal read-only RBAC for the host Traefik's kubernetesCRD provider —
# NOT the full admin kubeconfig ArgoCD uses. Permission set matches
# Traefik's own documented RBAC reference (kubernetes-crd-rbac.yml), applied
# by systemd.services.traefik-k8s-rbac (./kubernetes-crd.nix).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: traefik-external
  namespace: kube-system
---
apiVersion: v1
kind: Secret
metadata:
  name: traefik-external-token
  namespace: kube-system
  annotations:
    kubernetes.io/service-account.name: traefik-external
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: traefik-external
rules:
  - apiGroups: [""]
    resources: ["services", "secrets", "nodes", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["list", "watch"]
  - apiGroups: ["extensions", "networking.k8s.io"]
    resources: ["ingresses", "ingressclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["extensions", "networking.k8s.io"]
    resources: ["ingresses/status"]
    verbs: ["update"]
  - apiGroups: ["traefik.io"]
    resources:
      - middlewares
      - middlewaretcps
      - ingressroutes
      - traefikservices
      - ingressroutetcps
      - ingressrouteudps
      - tlsoptions
      - tlsstores
      - serverstransports
      - serverstransporttcps
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: traefik-external
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: traefik-external
subjects:
  - kind: ServiceAccount
    name: traefik-external
    namespace: kube-system
