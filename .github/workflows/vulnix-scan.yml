name: "Vulnix CVE Scan"
# Called by ci.yml, schedule/workflow_dispatch only. Scans ONE representative
# host's built closure (homeserver — broadest package set) against NVD CVEs.
# Not blocking, not run per-host/per-push: a cold-cache vulnix run downloads
# and parses ~5 years of NVD archives with no progress output and can take
# many minutes. Running it 4x in parallel on every push/PR (the original
# design) was needlessly slow and NVD-rate-limit-prone. `~/.cache/vulnix` is
# cached across runs (keyed by ISO week, falling back to last week's cache),
# so only the very first-ever run pays the full download — trigger this
# manually once via workflow_dispatch to warm it ahead of the nightly cron.
on:
  workflow_call:
    secrets:
      TELEGRAM_CHAT_ID:
        required: true
      TELEGRAM_BOT_TOKEN:
        required: true
jobs:
  vulnix:
    name: Scan homeserver closure for known CVEs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          extra-nix-config: |
            max-jobs = auto
            cores = 0
            builders-use-substitutes = true
            substituters = https://cache.nixos.org https://4rmcyt.cachix.org https://nix-community.cachix.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= 4rmcyt.cachix.org-1:yHVDqXs6TDmfSOuPbl4gcfomDK9gzTmK8FabfHLi+d8= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
      # Should hit Cachix (already pushed by the same night's
      # build-and-check-systems run), not rebuild from scratch.
      - name: Build homeserver configuration
        run: |
          nix build \
            .#nixosConfigurations.homeserver.config.system.build.toplevel \
            --print-build-logs
      - name: Get ISO week for vulnix cache key
        id: date
        run: echo "week=$(date +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Cache vulnix NVD feed
        uses: actions/cache@v4
        with:
          path: ~/.cache/vulnix
          key: vulnix-nvd-${{ steps.date.outputs.week }}
          restore-keys: vulnix-nvd-
      - name: Scan built closure for known CVEs (vulnix)
        id: vulnix
        continue-on-error: true
        # nvd.nist.gov itself is slow (~60 KB/s observed, confirmed in a
        # browser too — NIST's own infra, not a vulnix issue). Point at the
        # FCIX-hosted community mirror instead: same NVD JSON 2.0 file
        # layout (nvdcve-2.0-<year>.json.gz etc.), GPG-signed, no API key or
        # rate limit. See https://cveb.in/ (maintained by a cve-bin-tool/
        # OpenSSF maintainer). Not an official NIST source — fine for an
        # informational homelab scan, don't treat it as authoritative.
        # -j: JSON output, so the next step can build a Telegram summary.
        run: |
          nix run nixpkgs#vulnix -- \
            -j \
            -m https://mirror.cveb.in/nvd/json/cve/2.0/ \
            -w .github/vulnix-whitelist.toml \
            result >vulnix-results.json
      - name: Build CVE summary
        id: summary
        if: steps.vulnix.outcome == 'failure'
        continue-on-error: true
        run: |
          total=$(jq 'length' vulnix-results.json)
          top5=$(jq -r '
            [.[] | . as $pkg | ($pkg.cvssv3_basescore // {}) | to_entries[]
              | {name: $pkg.name, cve: .key, score: (.value // 0)}]
            | sort_by(-.score) | .[0:5][]
            | "• <code>\(.name)</code> — <a href=\"https://nvd.nist.gov/vuln/detail/\(.cve)\">\(.cve)</a> (CVSS \(.score))"
          ' vulnix-results.json)
          {
            echo "total=${total}"
            echo "top5<<VULNIX_SUMMARY_EOF"
            echo "$top5"
            echo "VULNIX_SUMMARY_EOF"
          } >>"$GITHUB_OUTPUT"
      - name: Notify - CVEs Found
        if: steps.vulnix.outcome == 'failure'
        uses: ./.github/actions/notify-telegram
        with:
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🔍 <b>vulnix: ${{ steps.summary.outputs.total || '?' }} known CVE(s) in homeserver closure</b>
            Repository: <code>${{ github.repository }}</code>
            Informational only — scans <code>homeserver</code> as a representative host, not the full fleet.

            Top 5 by CVSS:
            ${{ steps.summary.outputs.top5 || '(summary unavailable — see workflow log)' }}

            Full list in the workflow log.
            <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View Workflow</a>
