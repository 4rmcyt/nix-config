name: "CI"

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  nix-flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Restore and cache Nix store
        uses: nix-community/cache-nix-action@v5
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 10737418240  # 10GB
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-last-accessed: 42

      - name: Check flake
        run: nix flake check --show-trace

  nix-format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Check formatting
        run: nix fmt -- --check .

  build-configurations:
    runs-on: ubuntu-latest
    needs: [nix-flake-check]
    strategy:
      matrix:
        system:
          - desktop
          - homeserver
          - laptop
          - wsl
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            max-jobs = auto
            cores = 0

      - name: Restore and cache Nix store
        uses: nix-community/cache-nix-action@v5
        with:
          primary-key: nix-${{ runner.os }}-${{ matrix.system }}-${{ hashFiles('**/*.nix', 'flake.lock') }}
          restore-prefixes-first-match: |
            nix-${{ runner.os }}-${{ matrix.system }}-
            nix-${{ runner.os }}-
          gc-max-store-size-linux: 10737418240
          purge: true
          purge-prefixes: nix-${{ runner.os }}-${{ matrix.system }}-
          purge-last-accessed: 42

      - name: Build ${{ matrix.system }}
        run: |
          nix build \
            .#nixosConfigurations.${{ matrix.system }}.config.system.build.toplevel \
            --print-build-logs \
            --show-trace
