name: "CI"
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 3 * * *"
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: write
  pull-requests: write
jobs:
  # =================================================================
  # Validate - Run fast checks like formatting and flake validation
  # =================================================================
  validate:
    name: Validate Flake & Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: nix-community
          skipPush: true
      - name: Restore and cache Nix store
        uses: nix-community/cache-nix-action@v5
        with:
          primary-key: nix-${{ runner.os }}-flake-${{ hashFiles('**/*.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-flake-
          gc-max-store-size-linux: 5368709120 # 5GB
          purge: true
          purge-prefixes: nix-${{ runner.os }}-flake-
          purge-last-accessed: 42
      - name: Update flake inputs (in-memory)
        run: nix flake update
      - name: Check formatting
        run: nix fmt -- --ci .
      - name: Check flake
        run: nix flake check --all-systems --show-trace
      - name: Send Telegram notification - Validation Failed
        if: failure() && github.event_name != 'pull_request'
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            ❌ *Validation Failed (Format or Flake Check)*
            Repository: `${{ github.repository }}`
            Branch: `${{ github.ref_name }}`
            Trigger: ${{ github.event_name }}
            [View Workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
  # =================================================================
  # Build & Check Systems - Call the reusable workflow for each system
  # =================================================================
  build-and-check-systems:
    name: Build & Check ${{ matrix.system }}
    needs: [validate]
    strategy:
      fail-fast: false
      matrix:
        system:
          - desktop
          - homeserver
          - matebook
          - wsl
    uses: ./.github/workflows/reusable-build.yml
    with:
      system: ${{ matrix.system }}
      # Pass event info to the reusable workflow
      ref_name: ${{ github.ref_name }}
      ref_type: ${{ github.ref_type }}
      event_name: ${{ github.event_name }}
      commit_message: ${{ github.event.head_commit.message }}
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  # =================================================================
  # Workflow Summary - Send overall workflow status
  # =================================================================
  workflow-summary:
    name: Workflow Summary
    runs-on: ubuntu-latest
    needs: [validate, build-and-check-systems]
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    steps:
      - name: Send Telegram notification - All Checks Passed
        if: needs.validate.result == 'success' && needs.build-and-check-systems.result == 'success'
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            ✅ *CI Workflow Completed Successfully*
            Repository: `${{ github.repository }}`
            Branch: `${{ github.ref_name }}`
            All checks passed:
            ✅ Validation (Format & Flake)
            ✅ All systems built (desktop, homeserver, matebook, wsl)
            ✅ Home manager validation
            [View Workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
