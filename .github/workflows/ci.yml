name: "CI"
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  # =================================================================
  # Format Check - Fast feedback on formatting issues
  # =================================================================
  format-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: nix-community
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          skipPush: true

      - name: Check formatting
        run: nix fmt -- --ci .

  # =================================================================
  # Flake Check - Validate flake structure and evaluations
  # =================================================================
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: nix-community
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          skipPush: true

      - name: Restore and cache Nix store
        uses: nix-community/cache-nix-action@v5
        with:
          primary-key: nix-${{ runner.os }}-flake-${{ hashFiles('**/*.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-flake-
          gc-max-store-size-linux: 10737418240 # 10GB
          purge: true
          purge-prefixes: nix-${{ runner.os }}-flake-
          purge-last-accessed: 42

      - name: Check flake
        run: nix flake check --all-systems --show-trace

  # =================================================================
  # Build Configurations - Build all NixOS system configurations
  # =================================================================
  build-systems:
    runs-on: ubuntu-latest
    needs: [flake-check]
    strategy:
      matrix:
        system:
          - desktop
          - homeserver
          - matebook
          - wsl
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            max-jobs = auto
            cores = 0
            substituters = https://cache.nixos.org https://nix-community.cachix.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=

      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: nix-community
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          skipPush: true

      - name: Restore and cache Nix store
        uses: nix-community/cache-nix-action@v5
        with:
          primary-key: nix-${{ runner.os }}-${{ matrix.system }}-${{ hashFiles('**/*.nix', 'flake.lock') }}
          restore-prefixes-first-match: |
            nix-${{ runner.os }}-${{ matrix.system }}-
            nix-${{ runner.os }}-
          gc-max-store-size-linux: 10737418240
          purge: true
          purge-prefixes: nix-${{ runner.os }}-${{ matrix.system }}-
          purge-last-accessed: 42

      - name: Build ${{ matrix.system }} configuration
        run: |
          nix build \
            .#nixosConfigurations.${{ matrix.system }}.config.system.build.toplevel \
            --print-build-logs \
            --show-trace

  # =================================================================
  # Home Manager Check - Validate home-manager configurations
  # =================================================================
  check-home-manager:
    runs-on: ubuntu-latest
    needs: [flake-check]
    strategy:
      matrix:
        config:
          - desktop
          - homeserver
          - matebook
          - wsl
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: nix-community
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          skipPush: true

      - name: Validate home-manager configuration for ${{ matrix.config }}
        run: |
          # Home-manager configs are embedded in NixOS configs
          # This step validates they can be evaluated
          nix eval .#nixosConfigurations.${{ matrix.config }}.config.home-manager.users --apply 'x: "ok"'
