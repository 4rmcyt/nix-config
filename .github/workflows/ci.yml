name: "CI"
# Orchestrator only — no build/check logic lives here. Each stage below is
# its own reusable workflow file; see docs/CI-CD.md for the full pipeline
# diagram and what each one actually does.
#
#   flake-lock-update (schedule/dispatch only)
#     └─ validate ─────────────┐
#     └─ security-checks ──────┤─→ build-and-check-systems ─→ workflow-summary
#   vulnix-scan (schedule/dispatch only, independent of the above)
#
on:
  workflow_dispatch: # Manual trigger
  pull_request: # PRs to any branch
  push:
    branches:
      - main # Auto-run on main branch
  schedule:
    - cron: "0 3 * * *" # Daily at 3 AM America/Edmonton
      timezone: "America/Edmonton"
permissions:
  actions: read
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  # Only on schedule/dispatch — see flake-lock-update.yml. Skipped on
  # push/pull_request so those runs never get an unrelated auto-commit.
  flake-lock-update:
    name: Flake Lock Update
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # GITHUB_TOKEN permissions for a called reusable workflow are capped by
    # the CALLING job, not just what the callee's own file declares — the
    # callee needs contents:write to push the commit, so it must be granted
    # here too, or the push 403s regardless of flake-lock-update.yml's own
    # `permissions:` block.
    permissions:
      contents: write
    # Top-level workflow `concurrency:` alone doesn't reliably cancel
    # already-running steps *inside* a called reusable workflow — observed
    # live: a superseded run kept executing Validate's steps for 9+ minutes
    # after a newer push started. `jobs.<job_id>.concurrency` is one of the
    # few keys GitHub explicitly allows on a job that calls a reusable
    # workflow (docs: "reuse-workflows#supported-keywords") — set it on every
    # `uses:` job too so each one gets its own cancellation checkpoint
    # instead of relying solely on the orchestrator-level group.
    concurrency:
      group: ${{ github.workflow }}-flake-lock-update-${{ github.ref_name }}
      cancel-in-progress: true
    uses: ./.github/workflows/flake-lock-update.yml
    secrets: inherit
  # Non-blocking fmt/flake-check — see validate.yml for why.
  validate:
    name: Validate
    needs: [flake-lock-update]
    if: always() && (needs.flake-lock-update.result == 'success' || needs.flake-lock-update.result == 'skipped')
    concurrency:
      group: ${{ github.workflow }}-validate-${{ github.ref_name }}
      cancel-in-progress: true
    uses: ./.github/workflows/validate.yml
    with:
      flake_lock_changed: ${{ needs.flake-lock-update.outputs.changes_detected == 'true' }}
    secrets: inherit
  # Trivy + TruffleHog + SOPS + syntax — hard gate, runs in parallel with
  # validate. See security-checks.yml for the 4 checks it bundles.
  security-checks:
    name: Security Checks
    # Same caller-caps-callee rule as flake-lock-update above: every job
    # inside security-checks.yml needs at least contents:read for checkout.
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-security-checks-${{ github.ref_name }}
      cancel-in-progress: true
    uses: ./.github/workflows/security-checks.yml
    secrets: inherit
  # Real build of every host — the actual gate. See reusable-build.yml.
  build-and-check-systems:
    name: Build & Check ${{ matrix.system }}
    needs: [validate, security-checks]
    strategy:
      fail-fast: false # Continue building other systems even if one fails
      max-parallel: 4 # Build systems in parallel
      matrix:
        system:
          - desktop # AMD Zen 4 (znver4)
          - homeserver # Intel Skylake
          - matebook # AMD Zen 1 (znver1)
          - gcp-relay
    # Keyed per-system too — otherwise the 4 matrix jobs would share one
    # group and cancel each other instead of only superseded runs.
    concurrency:
      group: ${{ github.workflow }}-build-${{ matrix.system }}-${{ github.ref_name }}
      cancel-in-progress: true
    uses: ./.github/workflows/reusable-build.yml
    with:
      system: ${{ matrix.system }}
      ref_name: ${{ github.ref_name }}
      ref_type: ${{ github.ref_type }}
      event_name: ${{ github.event_name }}
      commit_message: ${{ github.event.head_commit.message }}
    secrets: inherit
  # Scans one host's built closure for known CVEs. Schedule/dispatch only —
  # not part of the push/PR gate. Needs build-and-check-systems so it builds
  # against the same freshly-committed flake.lock that just got built and
  # pushed to Cachix — without this it can race flake-lock-update's commit
  # and end up scanning (and slowly rebuilding) a stale closure instead of
  # what's actually being deployed. See vulnix-scan.yml for the rest.
  vulnix-scan:
    name: Vulnix CVE Scan
    needs: [build-and-check-systems]
    if: success() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    concurrency:
      group: ${{ github.workflow }}-vulnix-scan-${{ github.ref_name }}
      cancel-in-progress: true
    uses: ./.github/workflows/vulnix-scan.yml
    secrets: inherit
  # ==========================================================================
  # Workflow Summary - Send overall workflow status
  # ==========================================================================
  workflow-summary:
    name: Workflow Summary
    runs-on: ubuntu-latest
    needs: [validate, security-checks, build-and-check-systems]
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    steps:
      # Needed because notify-telegram below is a local composite action —
      # `uses: ./...` resolves from the checked-out workspace.
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Notify - All Checks Passed
        if: needs.validate.result == 'success' && needs.security-checks.result == 'success' && needs.build-and-check-systems.result == 'success'
        uses: ./.github/actions/notify-telegram
        with:
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ✅ <b>CI Workflow Completed Successfully</b>
            Repository: <code>${{ github.repository }}</code>
            Branch: <code>${{ github.ref_name }}</code>
            All checks passed:
            ✅ Validation (Format &amp; Flake)
            ✅ Security (Trivy, TruffleHog, SOPS, syntax)
            ✅ All systems built (desktop, homeserver, matebook, gcp-relay)
            <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View Workflow</a>
      - name: Notify - Issues Detected
        if: needs.validate.result != 'success' || needs.security-checks.result != 'success' || needs.build-and-check-systems.result != 'success'
        uses: ./.github/actions/notify-telegram
        with:
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ❌ <b>CI Workflow - Issues Detected</b>
            Repository: <code>${{ github.repository }}</code>
            Branch: <code>${{ github.ref_name }}</code>

            Check results:
            ${{ needs.validate.result == 'success' && '✅' || '❌' }} Validation (Format &amp; Flake)
            ${{ needs.security-checks.outputs.trivy_result == 'success' && '✅' || '❌' }} Trivy vulnerability scan
            ${{ needs.security-checks.outputs.secret_scan_result == 'success' && '✅' || '❌' }} Secret detection
            ${{ needs.security-checks.outputs.sops_result == 'success' && '✅' || '❌' }} SOPS validation
            ${{ needs.security-checks.outputs.syntax_result == 'success' && '✅' || '❌' }} Syntax validation
            ${{ needs.build-and-check-systems.result == 'success' && '✅' || '❌' }} System builds

            <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View Workflow</a>
