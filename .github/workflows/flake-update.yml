name: "Daily Flake Update"
on:
  workflow_dispatch: # Allows you to run this manually
  schedule:
    - cron: "0 0 * * *" # Runs every day at 00:00 UTC
# Permissions to write to the repository
permissions:
  contents: write
jobs:
  # =================================================================
  # Update Flake Lock - Automatically update flake.lock on a schedule
  # =================================================================
  update-flake-lock:
    name: Update Flake Lock File
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: nix-community
          skipPush: true
      - name: Update flake.lock
        id: flake-update
        run: nix flake update
      - name: Commit updated flake.lock
        id: commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "ci: update flake.lock [skip ci]" # [skip ci] is crucial to prevent CI loops
          file_pattern: "flake.lock"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
      - name: Send Telegram notification - Flake Lock Updated
        # Only send if the commit step actually found changes
        if: success() && steps.commit.outputs.changes_detected == 'true'
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            🔄 *Flake Lock File Updated*

            Repository: `${{ github.repository }}`
            Branch: `main`
            Trigger: ${{ github.event_name }}

            The `flake.lock` file has been automatically updated and pushed to `main`.
            This commit will **not** trigger a new CI run.

            [View Commit](${{ github.server_url }}/${{ github.repository }}/commit/${{ steps.commit.outputs.commit_hash }})
      - name: Send Telegram notification - Flake Update Failed
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            ❌ *Flake Lock Update Failed*

            Repository: `${{ github.repository }}`
            Branch: `main`
            Trigger: ${{ github.event_name }}

            The daily `nix flake update` job failed. Please check the logs.

            [View Workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
