name: Ship Logs to Loki
# This workflow ships GitHub Actions logs to your Loki instance
# It runs after the CI workflow completes
on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
permissions:
  actions: read
  contents: read
jobs:
  ship-logs:
    name: Ship Workflow Logs to Loki
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event != 'pull_request'
    steps:
      - name: Download workflow logs
        id: download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Downloading logs for run ${{ github.event.workflow_run.id }}..."

          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/logs \
            > workflow-logs.zip

          unzip -q workflow-logs.zip -d logs/
          echo "Downloaded $(ls logs/ | wc -l) log files"
      - name: Ship logs to Loki
        env:
          LOKI_URL: ${{ secrets.LOKI_ENDPOINT }}
          LOKI_AUTH_TOKEN: ${{ secrets.LOKI_AUTH_TOKEN }}
        run: |
          set -e

          echo "Shipping logs to Loki..."

          # Process each log file
          for log_file in logs/*.txt; do
            [ -f "$log_file" ] || continue

            job_name=$(basename "$log_file" .txt)
            echo "Processing: $job_name"

            # Read log file and create Loki payload
            # Each line becomes a log entry with timestamp
            timestamp_ns=$(date +%s)000000000

            # Create JSON payload for Loki push API
            jq -Rs --arg ts "$timestamp_ns" \
                   --arg job "github-actions" \
                   --arg workflow "${{ github.event.workflow_run.name }}" \
                   --arg repository "${{ github.repository }}" \
                   --arg branch "${{ github.event.workflow_run.head_branch }}" \
                   --arg status "${{ github.event.workflow_run.conclusion }}" \
                   --arg job_name "$job_name" \
              '{
                streams: [{
                  stream: {
                    job: $job,
                    workflow: $workflow,
                    repository: $repository,
                    branch: $branch,
                    status: $status,
                    job_name: $job_name
                  },
                  values: [
                    [$ts, .]
                  ]
                }]
              }' "$log_file" > payload.json

            # Send to Loki
            curl -X POST \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $LOKI_AUTH_TOKEN" \
              -d @payload.json \
              "$LOKI_URL/loki/api/v1/push" || echo "Warning: Failed to ship $job_name"

            rm payload.json
          done

          echo "✅ Log shipping completed"
