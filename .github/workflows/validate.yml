name: "Validate"
# Called by ci.yml.
#  - `nix fmt` (also runs statix/deadnix via treefmt.nix): non-blocking —
#    a formatting failure warns via Telegram but doesn't fail the job.
#  - `nix flake check`: BLOCKING — a flake-check failure fails this job, which
#    gates build-and-check-systems. It only runs when flake.lock actually
#    changed (or flake_lock_changed was passed) to keep push/PR runs fast.
on:
  workflow_call:
    inputs:
      flake_lock_changed:
        description: "Whether the upstream flake-lock-update job actually changed flake.lock"
        type: boolean
        required: false
        default: false
    secrets:
      TELEGRAM_CHAT_ID:
        required: true
      TELEGRAM_BOT_TOKEN:
        required: true
jobs:
  validate:
    name: Validate Flake & Formatting
    runs-on: ubuntu-latest
    steps:
      # Checkout (picks up the just-committed flake.lock on schedule/dispatch runs)
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          extra-nix-config: |
            max-jobs = auto
            cores = 0
            builders-use-substitutes = true
            extra-substituters = https://nix-community.cachix.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
      - name: Check for uncommitted changes before flake update
        run: |
          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "❌ Uncommitted changes detected before flake update!"
            git status
            git diff
            exit 1
          fi
      - name: Update flake inputs (in-memory)
        run: nix flake update
      - name: Check if flake.lock changed
        id: flake-changed
        run: |
          if git diff --quiet flake.lock; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "✅ flake.lock unchanged - skipping flake check"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "⚠️ flake.lock changed - will run flake check"
            git diff flake.lock
          fi
      - name: Validate flake metadata
        run: |
          echo "📦 Validating flake metadata and structure..."
          nix flake metadata --json | jq .
          nix flake show
          echo "✅ Flake structure is valid"
      # Formatting check (informational only - doesn't fail the job)
      - name: Check formatting
        id: formatting
        continue-on-error: true
        run: nix fmt -- --ci .
      - name: Notify - Formatting Failed
        if: steps.formatting.outcome == 'failure' && github.event_name != 'pull_request'
        uses: ./.github/actions/notify-telegram
        with:
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ⚠️ <b>Formatting Check Failed (Non-blocking)</b>
            Repository: <code>${{ github.repository }}</code>
            Branch: <code>${{ github.ref_name }}</code>
            Trigger: <code>${{ github.event_name }}</code>
            The formatting check failed but the workflow will continue.
            <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View Workflow</a>
      # Flake check — BLOCKING. Fails the job (and the build gate) on error.
      # Failure notification is handled by "Notify - Validation Failed" below
      # (the job now actually fails, so `failure()` catches it).
      - name: Check flake
        id: flake-check
        if: steps.flake-changed.outputs.changed == 'true' || inputs.flake_lock_changed
        run: nix flake check --show-trace
      - name: Notify - Validation Failed
        if: failure() && github.event_name != 'pull_request'
        uses: ./.github/actions/notify-telegram
        with:
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ❌ <b>Validation Failed (Format or Flake Check)</b>
            Repository: <code>${{ github.repository }}</code>
            Branch: <code>${{ github.ref_name }}</code>
            Trigger: <code>${{ github.event_name }}</code>
            <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View Workflow</a>
