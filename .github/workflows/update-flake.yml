name: "build"
on:
  push:
    branches:
      - master
    tags:
      - flake.lock
  pull_request: {}
  workflow_call: {}
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: "access-tokens = github.com=${{ github.token }}"
      - name: Update flake
        run: |
          nix_bin=$(which nix)
          nix flake update
      - name: Upload flake.lock
        uses: actions/upload-artifact@v4
        with:
          name: flake.lock
          path: flake.lock
      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: flake.lock
