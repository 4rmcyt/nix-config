name: Update Flake
on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  update:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            cache: homeserver
            config: nixosConfigurations.homeserver
          - os: macos-latest
            cache: macbookk
            config: darwinConfigurations.macbook
    
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4 
      - uses: cachix/install-nix-action@v25
      - uses: cachix/cachix-action@v14
        with:
          name: ${{ matrix.cache }}
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      
      - name: Update flake
        run: nix flake update
      
      - name: Test build
        run: nix build .#${{ matrix.config }}.config.system.build.toplevel
      
      - name: Create PR
        if: matrix.os == 'ubuntu-latest'  # Only create one PR
        uses: peter-evans/create-pull-request@v5
        with:
          title: "chore: update flake inputs"
          commit-message: "chore: update flake inputs"
          branch: update-flake
          delete-branch: true