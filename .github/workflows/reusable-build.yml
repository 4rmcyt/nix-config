name: "Reusable: Build and Check System"
on:
  workflow_call:
    inputs:
      system:
        required: true
        type: string
      ref_name:
        required: true
        type: string
      ref_type:
        required: true
        type: string
      event_name:
        required: true
        type: string
      commit_message:
        required: false
        type: string
    secrets:
      CACHIX_AUTH_TOKEN:
        required: true
      TELEGRAM_CHAT_ID:
        required: true
      TELEGRAM_BOT_TOKEN:
        required: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Notify - Build Started
        if: inputs.event_name != 'pull_request'
        uses: ./.github/actions/notify-telegram
        with:
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🔨 *Build Started*
            Repository: `${{ github.repository }}`
            Branch: `${{ inputs.ref_name }}`
            System: `${{ inputs.system }}`
            Trigger: ${{ inputs.event_name }}
            Commit: `${{ inputs.commit_message || 'N/A' }}`
            [View Workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
      - name: Free up disk space
        run: |
          echo "=== Before cleanup ==="
          df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" /usr/local/lib/android /usr/share/swift
          echo "=== After cleanup ==="
          df -h
      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          extra-nix-config: |
            max-jobs = auto
            cores = 0
            builders-use-substitutes = true
            substituters = https://cache.nixos.org https://4rmcyt.cachix.org https://nix-community.cachix.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= 4rmcyt.cachix.org-1:yHVDqXs6TDmfSOuPbl4gcfomDK9gzTmK8FabfHLi+d8= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
      - name: Update flake inputs (in-memory)
        run: nix flake update
      - name: Setup Cachix for ${{ inputs.system }} (Push)
        uses: cachix/cachix-action@v17
        with:
          name: 4rmcyt
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          skipPush: ${{ inputs.ref_type != 'branch' || inputs.ref_name != 'main' }}
      - name: Validate Home Manager config for ${{ inputs.system }}
        run: |
          echo "Validating Home Manager config for ${{ inputs.system }}..."
          nix eval .#nixosConfigurations.${{ inputs.system }}.config.home-manager.users --apply 'x: "ok"'
      - name: Build ${{ inputs.system }} configuration
        run: |
          echo "Building system config for ${{ inputs.system }}..."
          nix build \
            .#nixosConfigurations.${{ inputs.system }}.config.system.build.toplevel \
            --print-build-logs \
            --show-trace
      # vulnix (CVE scan of the built closure) intentionally does NOT run
      # here — see vulnix-scan.yml. A cold-cache vulnix run downloads and
      # parses ~5 years of NVD archives with no progress output and can take
      # many minutes; running it per-host, per-push (4x in parallel on every
      # commit) was needlessly slow and NVD-rate-limit-prone. It now runs
      # once, nightly, against a single representative host.
      - name: Notify - Build Failed
        if: failure() && inputs.event_name != 'pull_request'
        uses: ./.github/actions/notify-telegram
        with:
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ❌ *Build Failed*
            Repository: `${{ github.repository }}`
            Branch: `${{ inputs.ref_name }}`
            System: `${{ inputs.system }}`
            Trigger: ${{ inputs.event_name }}
            Build or Home Manager validation failed.
            [View Workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
      - name: Notify - Build Success
        if: success() && inputs.ref_type == 'branch' && inputs.ref_name == 'main'
        uses: ./.github/actions/notify-telegram
        with:
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ✅ *Build Successful*
            Repository: `${{ github.repository }}`
            Branch: `${{ inputs.ref_name }}`
            System: `${{ inputs.system }}`
            Build completed and pushed to Cachix.
            [View Workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
