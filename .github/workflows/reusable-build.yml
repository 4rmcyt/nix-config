name: "Reusable: Build and Check System"
on:
  workflow_call:
    inputs:
      system:
        required: true
        type: string
      ref_name:
        required: true
        type: string
      ref_type:
        required: true
        type: string
      event_name:
        required: true
        type: string
      commit_message:
        required: false
        type: string
    secrets:
      CACHIX_AUTH_TOKEN:
        required: true
      TELEGRAM_CHAT_ID:
        required: true
      TELEGRAM_BOT_TOKEN:
        required: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Sanitize commit message for Telegram HTML
        id: commit-msg
        # Raw commit subjects are free text and can contain literal
        # &, <, > — Telegram's HTML parse mode chokes on those (e.g. a
        # message mentioning `needs.<job>.result` breaks with "Unsupported
        # start tag" and fails the whole notify step). First line only,
        # then escape in the order that matters: & before < and >, or the
        # entities we just inserted get re-escaped.
        run: |
          msg=$(printf '%s' "${{ inputs.commit_message || 'N/A' }}" | head -n1)
          msg="${msg//&/&amp;}"
          msg="${msg//</&lt;}"
          msg="${msg//>/&gt;}"
          {
            echo "escaped<<COMMITMSG_EOF"
            echo "$msg"
            echo "COMMITMSG_EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Notify - Build Started
        if: inputs.event_name != 'pull_request'
        uses: ./.github/actions/notify-telegram
        with:
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🔨 <b>Build Started</b>
            Repository: <code>${{ github.repository }}</code>
            Branch: <code>${{ inputs.ref_name }}</code>
            System: <code>${{ inputs.system }}</code>
            Trigger: <code>${{ inputs.event_name }}</code>
            Commit: ${{ steps.commit-msg.outputs.escaped }}
            <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View Workflow</a>
      - name: Free up disk space
        run: |
          echo "=== Before cleanup ==="
          df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" /usr/local/lib/android /usr/share/swift
          echo "=== After cleanup ==="
          df -h
      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          extra-nix-config: |
            max-jobs = auto
            cores = 0
            builders-use-substitutes = true
            substituters = https://cache.nixos.org https://4rmcyt.cachix.org https://nix-community.cachix.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= 4rmcyt.cachix.org-1:yHVDqXs6TDmfSOuPbl4gcfomDK9gzTmK8FabfHLi+d8= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
      - name: Update flake inputs (in-memory)
        run: nix flake update
      - name: Setup Cachix for ${{ inputs.system }} (Push)
        uses: cachix/cachix-action@v17
        with:
          name: 4rmcyt
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          skipPush: ${{ inputs.ref_type != 'branch' || inputs.ref_name != 'main' }}
      - name: Validate Home Manager config for ${{ inputs.system }}
        run: |
          echo "Validating Home Manager config for ${{ inputs.system }}..."
          nix eval --impure --expr '
            let
              flake = builtins.getFlake (toString ./.);
              cfg = flake.nixosConfigurations."${{ inputs.system }}".config;
            in
              if cfg ? home-manager
              then builtins.seq cfg.home-manager.users "ok: home-manager configured"
              else "skip: ${{ inputs.system }} has no home-manager users (headless host)"
          '
      - name: Build ${{ inputs.system }} configuration
        run: |
          echo "Building system config for ${{ inputs.system }}..."
          nix build \
            .#nixosConfigurations.${{ inputs.system }}.config.system.build.toplevel \
            --print-build-logs \
            --show-trace
      # vulnix (CVE scan of the built closure) intentionally does NOT run
      # here — see vulnix-scan.yml. A cold-cache vulnix run downloads and
      # parses ~5 years of NVD archives with no progress output and can take
      # many minutes; running it per-host, per-push (4x in parallel on every
      # commit) was needlessly slow and NVD-rate-limit-prone. It now runs
      # once, nightly, against a single representative host.
      - name: Notify - Build Failed
        if: failure() && inputs.event_name != 'pull_request'
        uses: ./.github/actions/notify-telegram
        with:
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ❌ <b>Build Failed</b>
            Repository: <code>${{ github.repository }}</code>
            Branch: <code>${{ inputs.ref_name }}</code>
            System: <code>${{ inputs.system }}</code>
            Trigger: <code>${{ inputs.event_name }}</code>
            Build or Home Manager validation failed.
            <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View Workflow</a>
      - name: Notify - Build Success
        if: success() && inputs.ref_type == 'branch' && inputs.ref_name == 'main'
        uses: ./.github/actions/notify-telegram
        with:
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ✅ <b>Build Successful</b>
            Repository: <code>${{ github.repository }}</code>
            Branch: <code>${{ inputs.ref_name }}</code>
            System: <code>${{ inputs.system }}</code>
            Build completed and pushed to Cachix.
            <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View Workflow</a>
