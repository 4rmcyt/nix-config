name: "Flake Lock Update"
# Called by ci.yml, schedule/workflow_dispatch only: nix flake update, commit
# + push to main. Runs before validate/build so they see the fresh lock.
on:
  workflow_call:
    outputs:
      changes_detected:
        description: "'true' if flake.lock changed and was committed"
        value: ${{ jobs.update.outputs.changes_detected }}
    secrets:
      TELEGRAM_CHAT_ID:
        required: true
      TELEGRAM_BOT_TOKEN:
        required: true
permissions:
  contents: write
jobs:
  update:
    name: Update Flake Lock File
    runs-on: ubuntu-latest
    outputs:
      changes_detected: ${{ steps.commit.outputs.changes_detected }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          extra-nix-config: |
            max-jobs = auto
            cores = 0
      - name: Update flake.lock
        run: nix flake update
      - name: Commit updated flake.lock
        id: commit
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "ci: update flake.lock"
          file_pattern: "flake.lock"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
      - name: Notify - Flake Lock Updated
        if: success() && steps.commit.outputs.changes_detected == 'true'
        uses: ./.github/actions/notify-telegram
        with:
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🔄 <b>Flake Lock File Updated</b>

            Repository: <code>${{ github.repository }}</code>
            Branch: <code>main</code>
            Trigger: <code>${{ github.event_name }}</code>

            The <code>flake.lock</code> file has been automatically updated and pushed to <code>main</code>.
            Validation and builds are running next in this same workflow.

            <a href="${{ github.server_url }}/${{ github.repository }}/commit/${{ steps.commit.outputs.commit_hash }}">View Commit</a>
      - name: Notify - Flake Update Failed
        if: failure()
        uses: ./.github/actions/notify-telegram
        with:
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ❌ <b>Flake Lock Update Failed</b>

            Repository: <code>${{ github.repository }}</code>
            Branch: <code>main</code>
            Trigger: <code>${{ github.event_name }}</code>

            The scheduled <code>nix flake update</code> job failed. Please check the logs.

            <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View Workflow</a>
