name: Notify Telegram
description: Send a markdown-formatted status message to the repo's Telegram chat.
inputs:
  chat-id:
    description: Telegram chat ID (usually secrets.TELEGRAM_CHAT_ID).
    required: true
  bot-token:
    description: Telegram bot token (usually secrets.TELEGRAM_BOT_TOKEN).
    required: true
  message:
    description: Markdown message body.
    required: true
runs:
  using: composite
  steps:
    - uses: appleboy/telegram-action@v1.0.1
      with:
        to: ${{ inputs.chat-id }}
        token: ${{ inputs.bot-token }}
        format: markdown
        message: ${{ inputs.message }}
