# Prek configuration - drop-in replacement for pre-commit hooks
exclude: |
  (?x)^(
    flake\.lock|
  )$
repos:
  # File format validation and formatting
  - repo: https://github.com/google/yamlfmt
    rev: v0.21.0
    hooks:
      - id: yamlfmt
        exclude: ^secrets/
  - repo: https://github.com/sirwart/ripsecrets
    rev: v0.1.11
    hooks:
      - id: ripsecrets
        exclude: |
          (?x)^(
            \.ripsecrets\.toml|
            modules/users/zeev/default\.nix|
            modules/networking/ssh-hosts\.nix|
            modules/networking/ssh/default\.nix|
            modules/TUI/common/default\.nix|
            modules/GUI/thunderbird/default\.nix|
            modules/options/defaults\.nix|
            modules/GUI/chromium/default\.nix|
            home/matebook/default\.nix|
            modules/services/nixarr/recyclarr\.yaml|
            modules/security/keycloak/homelab-realm\.json|
            modules/security/keycloak/default\.nix|
            hosts/nixos/wsl/default\.nix|
            hosts/nixos/homeserver/default\.nix|
            hosts/nixos/matebook/default\.nix|
            hosts/nixos/gcp/default\.nix|
            parts/owner\.nix
          )$
  - repo: local
    hooks:
      - id: gitleaks
        name: Detect hardcoded secrets
        entry: gitleaks protect --staged --redact --verbose
        language: system
        pass_filenames: false
  # Nix tools (local hooks using system binaries from nix shell)
  - repo: local
    hooks:
      - id: taplo-format
        name: Taplo TOML formatter
        entry: taplo format
        language: system
        files: \.toml$
        pass_filenames: true
      - id: alejandra
        name: Alejandra Nix formatter
        entry: alejandra
        language: system
        files: \.nix$
      - id: deadnix
        name: Deadnix - remove unused Nix code
        entry: deadnix --fail --edit
        language: system
        files: \.nix$
        pass_filenames: true
      - id: statix
        name: Statix - Nix linter
        entry: statix fix
        language: system
        files: \.nix$
        pass_filenames: false
        # Disabled due to unknown error - no snapshot tests in repository
        # - id: namaka-check
        #   name: Namaka snapshot tests
        #   entry: namaka check
        #   language: system
        #   files: \.nix$
        #   pass_filenames: false
  # Project-specific hooks
  - repo: local
    hooks:
      - id: dangerous-shell-patterns
        name: Check for dangerous shell patterns
        entry: tools/scripts/check-dangerous-patterns.sh
        language: system
        files: \.nix$|\.sh$
      - id: pre-commit-hook-ensure-sops
        name: Ensure SOPS secrets are encrypted
        entry: pre-commit-hook-ensure-sops
        language: system
        files: ^secrets/.*\.yaml$
