[formatter.deadnix]
command = "deadnix"
options = ["--edit"]
includes = ["*.nix"]

[formatter.statix]
command = "statix"
includes = ["*.nix"]

[formatter.shfmt]
command = "shfmt"
excludes = []
includes = ["*.sh", "*.bash", "*.envrc", "*.envrc.*"]
options = ["-s", "-w", "-i", "2"]


[formatter.prettier]
command = "prettier"
options = ["--write"]
includes = ["webpage/**/*.vue", "webpage/**/*.js", "*.md", "*.yaml", "*.yml"]


[formatter.rust]
options = ["--edition", "2018"]
includes = ["*.rs"]


[formatter.just]
command = "just"
options = ["--unstable", "--fmt", "--justfile",]
includes = [".justfile",]


[formatter.nixfmt-rfc-style]
command = "nixfmt"
excludes = []
includes = ["*.nix"]
options = []

[formatter.cmake-format]
command = "cmake-format"
includes = ["**/*.cmake", "**/CMakeLists.txt"]
options = ["--in-place"]