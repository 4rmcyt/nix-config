root = "flake.nix"

[global]
# Excludes a list of files and patterns from being formatted.
excludes = [
  "secrets/*",
  "*.png",
  "*.jpeg",
  "*.yaml",
  "*.gitignore",
  ".vscode/*",
  "*.toml",
  "*.clan-flake",
  "*.code-workspace",
  "*.pub",
  "*.typed",
  "*.age",
  "*.list",
  "*.desktop",
]

# The 'programs' section from your Nix file is translated into individual
# 'formatter' tables in TOML.

[formatter.alejandra]
command = "alejandra"

[formatter.deadnix]
command = "deadnix"

[formatter.statix]
command = "statix"

[formatter.shfmt]
command = "shfmt"

[formatter.prettier]
command = "prettier"


[formatter.rust]
command = "rustfmt"
options = ["--edition", "2018"]
includes = ["*.rs"]