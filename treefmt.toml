root = "flake.nix"

[global]
# Excludes a list of files and patterns from being formatted.
excludes = [
  "secrets/*",
  "*.png",
  "*.jpeg",
  "*.yaml",
  "*.gitignore",
  ".vscode/*",
  "*.clan-flake",
  "*.code-workspace",
  "*.pub",
  "*.typed",
  "*.age",
  "*.list",
  "*.desktop",
]

# The 'programs' section from your Nix file is translated into individual
# 'formatter' tables in TOML.

[formatter.alejandra]
command = "alejandra"
includes = ["*.nix"]

[formatter.nix]
command = "nixfmt-rfc-style"
includes = ["*.nix"]

[formatter.deadnix]
command = "deadnix"
includes = ["*.nix"]

[formatter.statix]
command = "statix"
includes = ["*.nix"]

[formatter.shfmt]
command = "shfmt"
includes = ["*.sh"]

[formatter.prettier]
command = "prettier"
includes = ["*.js", "*.ts", "*.json", "*.md", "*.css", "*.html"]

[formatter.rust]
options = ["--edition", "2018"]
includes = ["*.rs"]