keys:
  - &zeev age147ne38q0m33qxclgsrsvzglkanc0c86vtaq5a4n4xvjpddfgce2s46qnz5
  - &vk age1h9kk9fktkn0t2yk7m89jxlf2atl0808ewn3j5updmq8knt0c84uqs24ew4
  - &homeserver age147ne38q0m33qxclgsrsvzglkanc0c86vtaq5a4n4xvjpddfgce2s46qnz5
  - &mypgp FD1AA16D16ACD8A003AD6D7AD85B52C9288A138E

creation_rules:
  - path_regex: 'secrets/.*\.yaml$'
    # This defines the two groups of keys that can decrypt the file
    key_groups:
      - pgp:
          - *mypgp
      - age:
          - *homeserver
          - *zeev
          - *vk
    # This tells sops it only needs ONE of the above groups to succeed
    threshold: 1

  - path_regex: 'secrets/wg.conf$'
    key_groups:
      - age:
          - *homeserver
